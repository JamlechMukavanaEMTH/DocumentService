[project]
name = "DocumentService"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "pydantic-settings>=2.4.0",
    "pydantic>=2.9.0",
    "python-multipart>=0.0.9",
    "redis[hiredis]>=5.0.0",
    "arq>=0.28.0",
    "pytesseract>=0.3.13",
    "Pillow>=10.4.0",
    "pdf2image>=1.17.0",
    "pikepdf>=9.3.0",
    "boto3>=1.34.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = ["B008", "S110"]

[tool.mypy]
python_version = "3.13"
strict = true

[tool.pytest.ini_options]
